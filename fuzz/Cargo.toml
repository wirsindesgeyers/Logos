[package]
name = "logos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
logos-canon = { path = "../crates/logos-canon" }
logos-crypto = { path = "../crates/logos-crypto" }
logos-core = { path = "../crates/logos-core" }
logos-air = { path = "../crates/logos-air" }
logos-model = { path = "../crates/logos-model" }

# Um target por parser/decoder de TCB (roadmap §4). O job noturno roda todos os targets listados
# por `cargo fuzz list`.
[[bin]]
name = "canon_decode"
path = "fuzz_targets/canon_decode.rs"
test = false
doc = false
bench = false

