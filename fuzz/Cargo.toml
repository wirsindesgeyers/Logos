[package]
name = "logos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
logos-canon = { path = "../crates/logos-canon" }
logos-crypto = { path = "../crates/logos-crypto" }
logos-core = { path = "../crates/logos-core" }
logos-air = { path = "../crates/logos-air" }
logos-seal = { path = "../crates/logos-seal" }
logos-model = { path = "../crates/logos-model" }
logos-obligation = { path = "../crates/logos-obligation" }
logos-ledger = { path = "../crates/logos-ledger" }
logos-ground = { path = "../crates/logos-ground" }
logos-lrat = { path = "../crates/logos-lrat" }
logos-kernel = { path = "../crates/logos-kernel" }

# Um target por parser/decoder de TCB (roadmap §4). O job noturno roda todos os targets listados
# por `cargo fuzz list`.
[[bin]]
name = "canon_decode"
path = "fuzz_targets/canon_decode.rs"
