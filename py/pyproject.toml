[project]
name = "logos"
version = "0.0.0"
description = "LOGOS — lado Python (agente, MCP, prover farm, avaliação). Tudo aqui é NÃO confiável."
# 3.14.x = Unicode 16.0.0, exigido por logos_client.canon (spec/encoding.md §5). O 3.15 trará
# Unicode 17: subir esta faixa exige canon/v2 (ADR 0003).
requires-python = ">=3.14,<3.15"
license = "MIT OR Apache-2.0"
dependencies = [
    "z3-solver==5.1.0.0",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logos_client", "logos_provers", "logos_mcp", "logos_agent", "logos_eval"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = ["../tools"]
files = ["logos_client", "logos_provers", "logos_mcp", "logos_agent", "logos_eval", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
