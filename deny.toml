# cargo-deny: licenças, fontes e allowlist de crates (roadmap §4 / Etapa 0.1).
# Toda nova dependência de TCB precisa de ADR e entrada em [bans].allow.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dependências de caminho entre membros do workspace (publish = false) não precisam de versão.
allow-wildcard-paths = true
# Allowlist: com a lista abaixo não vazia, qualquer crate fora dela é recusado.
allow = [
  { name = "logos-canon" },
  { name = "logos-crypto" },
  { name = "logos-core" },
  { name = "logos-air" },
  { name = "logos-air-text" }, # fora da TCB, ADR 0011
  { name = "logos-obligation" }, # AIR/canon/crypto workspace, ADR 0012
  { name = "logos-protocol" }, # JSON fora da TCB, ADR 0013
  { name = "logos-model" },
  { name = "logos-ground" },
  { name = "logos-lrat" },
  { name = "logos-alethe" },
  { name = "logos-ledger" },
  { name = "logos-seal" },
  { name = "logos-policy" },
  { name = "logos-token" },
  { name = "logos-kernel" },
  { name = "logos-gateway" },
  { name = "logos-attest" },
  { name = "logos-audit" },
  { name = "logos-cli" },
  { name = "logos-tui" },
  { name = "xtask" },
  # logos-canon (ADR 0003)
  { name = "unicode-normalization" },
  { name = "tinyvec" },
  # logos-crypto (ADR 0004)
  { name = "sha2" },
  { name = "ed25519-dalek" },
  { name = "ed25519" },
  { name = "curve25519-dalek" },
  { name = "curve25519-dalek-derive" },
  { name = "signature" },
  { name = "digest" },
  { name = "block-buffer" },
  { name = "crypto-common" },
  { name = "generic-array" },
  { name = "typenum" },
  { name = "subtle" },
  { name = "cfg-if" },
  { name = "cpufeatures" },
  { name = "libc" },
  { name = "fiat-crypto" },
  { name = "version_check" },
  { name = "rustc_version" },
  { name = "semver" },
  { name = "proc-macro2" },
  { name = "quote" },
  { name = "syn" },
  { name = "unicode-ident" },
  # logos-core/obligation dev (ADRs 0006/0012); serde/JSON runtime só fora da TCB (0013)
  { name = "trybuild" },
  { name = "equivalent" },
  { name = "glob" },
  { name = "hashbrown" },
  { name = "indexmap" },
  { name = "itoa" },
  { name = "memchr" },
  { name = "serde" },
  { name = "serde_core" },
  { name = "serde_derive" },
  { name = "serde_json" },
  { name = "serde_spanned" },
  { name = "target-tuple" },
  { name = "termcolor" },
  { name = "toml" },
  { name = "toml_datetime" },
  { name = "toml_parser" },
  { name = "toml_writer" },
  { name = "winapi-util" },
  { name = "windows-link" },
  { name = "windows-sys" },
  { name = "winnow" },
  { name = "zmij" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
