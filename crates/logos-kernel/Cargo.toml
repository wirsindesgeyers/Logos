[package]
name = "logos-kernel"
description = "Máquina de estados, protocolo e registry de checkers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
logos-air = { path = "../logos-air" }
logos-canon = { path = "../logos-canon" }
logos-core = { path = "../logos-core" }
logos-crypto = { path = "../logos-crypto" }
logos-ledger = { path = "../logos-ledger" }
logos-obligation = { path = "../logos-obligation" }
logos-ground = { path = "../logos-ground" }
logos-lrat = { path = "../logos-lrat" }
logos-model = { path = "../logos-model" }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "net", "process"] }

[dev-dependencies]
logos-audit = { path = "../logos-audit" }
logos-protocol = { path = "../logos-protocol" }
serde_json = "=1.0.151"
trybuild = "=1.0.121"

[lints]
workspace = true
