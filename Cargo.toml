[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/logos-canon",
    "crates/logos-crypto",
    "crates/logos-core",
    "crates/logos-air",
    "crates/logos-air-text",
    "crates/logos-obligation",
    "crates/logos-protocol",
    "crates/logos-model",
    "crates/logos-ground",
    "crates/logos-lrat",
    "crates/logos-alethe",
    "crates/logos-ledger",
    "crates/logos-seal",
    "crates/logos-policy",
    "crates/logos-token",
    "crates/logos-kernel",
    "crates/logos-gateway",
    "crates/logos-attest",
    "crates/logos-audit",
    "crates/logos-cli",
    "crates/logos-tui",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wirsindesgeyers/Logos"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# O corpus histórico tem223MB de LRAT; preservar checks de debug com execução viável na CI.
# ADR0029: só este pacote, sem alterar overflow-checks/debug-assertions do perfil test.
[profile.test.package.logos-lrat]
opt-level = 1
overflow-checks = true
debug-assertions = true

# ADR0031: hashes de centenas de MB de certificados no corpus externo.
# Manter overflow/debug; não altera o perfil de produção.
[profile.test.package.logos-crypto]
opt-level = 1
overflow-checks = true
debug-assertions = true

[profile.test.package.sha2]
opt-level = 1
overflow-checks = true
debug-assertions = true

# ADR0057: cada append assina e verifica Ed25519; em opt-level 0 isso leva ~0,3s
# e testes com janela de 1024 eventos levavam 5+ min. Mesmo padrão: só otimização,
# overflow/debug mantidos; não altera o perfil de produção.
[profile.test.package.curve25519-dalek]
opt-level = 1
overflow-checks = true
debug-assertions = true

[profile.test.package.ed25519-dalek]
opt-level = 1
overflow-checks = true
debug-assertions = true

# Idem para `cargo run`/`cargo build` de debug (smokes, kernel real dos testes Python).
[profile.dev.package.curve25519-dalek]
opt-level = 1

[profile.dev.package.ed25519-dalek]
opt-level = 1
