name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.arch }}, build, clippy, testes)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Confirmar arquitetura nativa
        run: test "$(uname -m)" = "${{ matrix.arch }}" && uname -m
      - name: Dependências do isolamento do cake_lpr
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Habilitar user namespaces do bwrap (AppArmor do Ubuntu 24.04)
        run: ci/enable-userns.sh
      - name: Instalar checker offline fixado
        run: python3 tools/build_cake_lpr.py
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Smoke público do core
        run: cargo run -p logos-core --example core_smoke
      - name: Smoke público da AIR
        run: cargo run -p logos-air --example air_smoke
      - name: Smoke público do vocabulário
        run: cargo run -p logos-air --example vocabulary_smoke
      - name: Smoke público do sort-checker
        run: cargo run -p logos-air --example sort_check_smoke
      - name: Smoke público da sintaxe de superfície
        run: cargo run -p logos-air-text --example air_text_smoke
      - name: Smoke público do gerador de obrigações
        run: cargo run -p logos-obligation --example obligation_smoke
      - name: Smoke público do protocolo de proposta
        run: cargo run -p logos-protocol --example protocol_smoke
      - name: Smoke público das estruturas finitas
        run: cargo run -p logos-model --example model_smoke
      - name: Smoke público do avaliador finito
        run: cargo run -p logos-model --example eval_smoke
      - name: Smoke público dos checkers de modelo
        run: cargo run -p logos-ledger --example checker_smoke
      - name: Smoke público dos eventos assinados
        run: cargo run -p logos-ledger --example events_smoke
      - name: Fragmentos finitos e candidatos de axiomas
        run: cargo run -p logos-ground --example fragment_smoke
      - name: Grounding condicional e bytes independentes
        run: cargo run -p logos-ground --example ground_smoke
      - name: Tseitin e DIMACS independentes
        run: cargo run -p logos-ground --example cnf_smoke
      - name: Checker LRAT RUP público
        run: cargo run -p logos-lrat --example lrat_smoke
      - name: Auditor independente (SQLite e export canônico)
        run: ci/check-audit.sh
      - uses: astral-sh/setup-uv@v5
      - name: Crash do ledger (SIGKILL, 10k appends, segundo escritor)
        run: ci/check-ledger-crash.sh
      - name: Índices do ledger (rebuild 100k, citabilidade p99 com 1M)
        run: ci/check-ledger-index.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-index-${{ matrix.arch }}
          path: target/ledger-index-scale.json

  sort-coverage:
    name: Sort-checker (100% dos ramos LLVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-28
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Exigir cobertura integral
        run: ci/check-sort-coverage.sh
      - name: Arquivar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sort-check-coverage
          path: target/sort-check-coverage.json

  tcb-rules:
    name: Regras da TCB e independência do auditor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: tcb/count.sh check
      - run: ci/check-tcb-lints.sh
      - run: ci/check-audit-independence.sh

  tcb-report:
    name: Medição da TCB
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei
      - name: Relatório do commit atual
        run: |
          cargo xtask tcb report --json tcb-head.json --markdown tcb-head.md
          cat tcb-head.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tcb-report
          path: |
            tcb-head.json
            tcb-head.md
      - name: Diferença em relação à base do PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git worktree add ../base "$BASE_SHA"
          if [ -f ../base/tcb/manifest.toml ]; then
            python3 tcb/tcb.py --root ../base report --json tcb-base.json >/dev/null
          else
            # base ainda sem manifesto (primeiro PR da Etapa 0.2): trata como TCB vazia
            python3 - <<'PY'
          import json
          head = json.load(open("tcb-head.json"))
          empty = {"properties": {k: {**v, "loc_total": 0} for k, v in head["properties"].items()},
                   "crates": [], "dependencies": []}
          json.dump(empty, open("tcb-base.json", "w"))
          PY
          fi
          python3 tcb/tcb.py diff tcb-base.json tcb-head.json | tee tcb-diff.md >> "$GITHUB_STEP_SUMMARY"
          # fork sem permissão de escrita: o resumo acima continua valendo
          gh pr comment "$PR" --body-file tcb-diff.md --edit-last --create-if-none || true

  supply-chain:
    name: cargo deny + cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit

  python:
    name: Python (ruff, mypy --strict, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # diferenciais canon/AIR-text chamam cargo
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      # Python 3.14 (py/.python-version): Unicode 16.0.0, igual ao crate Rust (spec/encoding.md §5)
      - run: uv sync --locked
      - run: uv run ruff check . ../tcb ../tools
      - run: uv run ruff format --check . ../tcb ../tools
      - run: uv run mypy
      - run: uv run mypy --strict ../tcb/tcb.py ../tcb/check_lints.py ../tcb/tests ../tools/gen_unicode_assigned.py ../tools/gen_crypto_vectors.py ../tools/gen_cas_vectors.py ../tools/gen_core_vectors.py ../tools/gen_air_vectors.py ../tools/gen_vocabulary_vectors.py ../tools/gen_obligation_vectors.py ../tools/gen_protocol_vectors.py ../tools/gen_kernel_protocol_vectors.py ../tools/gen_model_vectors.py ../tools/gen_event_vectors.py ../tools/gen_audit_vectors.py ../tools/gen_fragment_vectors.py ../tools/gen_grounding_vectors.py ../tools/gen_cnf_vectors.py ../tools/gen_lrat_vectors.py ../tools/lrat_corpus.py ../tools/build_cake_lpr.py ../tools/build_cadical.py ../tools/gen_sat_vectors.py ../tools/check_cnf.py ../tools/check_ledger_crash.py ../tools/gen_fact_vectors.py ../tools/gen_trust_vectors.py ../tools/gen_attest_vectors.py
      - run: uv run python ../tools/gen_unicode_assigned.py --check
      - run: uv run python ../tools/gen_crypto_vectors.py --check
      - run: uv run python ../tools/gen_cas_vectors.py --check
      - run: uv run python ../tools/gen_core_vectors.py --check
      - run: uv run python ../tools/gen_air_vectors.py --check
      - run: uv run python ../tools/gen_vocabulary_vectors.py --check
      - run: uv run python ../tools/gen_obligation_vectors.py --check
      - run: uv run python ../tools/gen_protocol_vectors.py --check
      - run: uv run python ../tools/gen_kernel_protocol_vectors.py --check
      - run: uv run python ../tools/gen_model_vectors.py --check
      - run: uv run python ../tools/gen_event_vectors.py --check
      - run: uv run python ../tools/gen_audit_vectors.py --check
      - run: uv run python ../tools/gen_fragment_vectors.py --check
      - run: uv run python ../tools/gen_grounding_vectors.py --check
      - run: uv run python ../tools/gen_cnf_vectors.py --check
      - run: uv run python ../tools/gen_lrat_vectors.py --check
      - run: uv run python ../tools/lrat_corpus.py --check
      - run: uv run python ../tools/gen_notebook_vectors.py --check
      - run: uv run python ../tools/gen_fact_vectors.py --check
      - run: uv run python ../tools/gen_trust_vectors.py --check
      - run: uv run python ../tools/gen_attest_vectors.py --check
      - name: CNF contra SAT Z3 e tabela verdade (5 mil O)
        run: ../ci/check-cnf.sh
      - name: Dependências do produtor SAT e isolamento do checker
        run: sudo apt-get update && sudo apt-get install -y g++ make bubblewrap util-linux
      - name: Habilitar user namespaces do bwrap (AppArmor do Ubuntu 24.04)
        run: ../ci/enable-userns.sh
      - name: Produtor SAT real e três checkers (300 políticas e300 contramodelos)
        run: ../ci/check-sat.sh
      - name: Farm isolada e500 obrigações no kernel real
        run: ../ci/check-farm.sh
      - name: Pesquisa MCP por stdio e auditoria de dez tarefas
        run: ../ci/check-mcp-research.sh
      - name: Templates vocabulary/v2 no kernel real
        run: ../ci/check-render-templates.sh
      - name: Caderno 5R.3 no kernel real (retratações e auditoria do corte)
        run: ../ci/check-notebook.sh
      - name: Isolamento 5.11 (pentest do agente em bwrap e units systemd)
        run: ../ci/check-isolation.sh
      - name: Kernel mínimo ponta a ponta 5.12 (make demo-kernel)
        run: ../ci/demo-kernel.sh
      - name: Arquivar evidência de templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-templates-report
          path: target/render-templates-report.json
      - name: Arquivar evidência MCP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-research-report
          path: target/mcp-research-report.json
      - name: Arquivar evidência da farm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-report
          path: target/farm-report.json
      - name: Arquivar evidência do produtor SAT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat-producer
          path: |
            target/sat-producer-report.json
            target/cadical/cadical.build.json
      - name: Smoke público do produtor Z3 com checker Rust
        run: uv run python -m logos_provers.z3_models_smoke
      - name: Smoke público do finder e fallback com unknown nativo
        run: uv run python -m logos_provers.model_finder_smoke
      - name: Smoke público de 20 contramodelos em português
        run: uv run python -m logos_provers.model_explain_smoke
      - run: uv run pytest -q # canon 100k/direção e AIR-text 500 fórmulas
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei
      - run: uv run pytest -q ../tcb/tests

  selftest:
    name: As regras bloqueiam o que deveriam bloquear
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: ci/selftest.sh

  cake-rebuild:
    name: cake_lpr rebuild (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_cake_lpr.py --rebuild --target x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: cake-rebuild-${{ matrix.host }}
          path: target/cake-lpr/cake_lpr.build.json
