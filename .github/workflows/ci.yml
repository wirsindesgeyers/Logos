name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (build, clippy, testes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  tcb-rules:
    name: Regras da TCB e independência do auditor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: tcb/count.sh check
      - run: ci/check-tcb-lints.sh
      - run: ci/check-audit-independence.sh

  tcb-report:
    name: Medição da TCB
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei
      - name: Relatório do commit atual
        run: |
          cargo xtask tcb report --json tcb-head.json --markdown tcb-head.md
          cat tcb-head.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tcb-report
          path: |
            tcb-head.json
            tcb-head.md
      - name: Diferença em relação à base do PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git worktree add ../base "$BASE_SHA"
          if [ -f ../base/tcb/manifest.toml ]; then
            python3 tcb/tcb.py --root ../base report --json tcb-base.json >/dev/null
          else
            # base ainda sem manifesto (primeiro PR da Etapa 0.2): trata como TCB vazia
            python3 - <<'PY'
          import json
          head = json.load(open("tcb-head.json"))
          empty = {"properties": {k: {**v, "loc_total": 0} for k, v in head["properties"].items()},
                   "crates": [], "dependencies": []}
          json.dump(empty, open("tcb-base.json", "w"))
          PY
          fi
          python3 tcb/tcb.py diff tcb-base.json tcb-head.json | tee tcb-diff.md >> "$GITHUB_STEP_SUMMARY"
          # fork sem permissão de escrita: o resumo acima continua valendo
          gh pr comment "$PR" --body-file tcb-diff.md --edit-last --create-if-none || true

  supply-chain:
    name: cargo deny + cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit

  python:
    name: Python (ruff, mypy --strict, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # o teste diferencial da canon chama `cargo`
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      # Python 3.14 (py/.python-version): Unicode 16.0.0, igual ao crate Rust (spec/encoding.md §5)
      - run: uv sync --locked
      - run: uv run ruff check . ../tcb ../tools
      - run: uv run ruff format --check . ../tcb ../tools
      - run: uv run mypy
      - run: uv run mypy --strict ../tcb/tcb.py ../tcb/tests ../tools/gen_unicode_assigned.py
      - run: uv run python ../tools/gen_unicode_assigned.py --check
      - run: uv run pytest -q # inclui o diferencial Rust x Python de 100k casos por direção
      - run: uv run pytest -q ../tcb/tests

  selftest:
    name: As regras bloqueiam o que deveriam bloquear
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: ci/selftest.sh
