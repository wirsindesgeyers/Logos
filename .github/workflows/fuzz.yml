name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *" # noturno: ≥ 1h por target
  workflow_dispatch:
    inputs:
      seconds:
        description: "Segundos por target"
        default: "3600"
  pull_request:
    paths: ["fuzz/**", "crates/**", "spec/core.md", "spec/vectors/core/**", "tools/gen_core_vectors.py", "spec/air.md", "spec/vectors/air/**", "tools/gen_air_vectors.py", "spec/vocabulary.md", "spec/vectors/vocabulary/**", "tools/gen_vocabulary_vectors.py", "spec/sort-check.md"] # smoke de poucos minutos

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '120' || inputs.seconds || '3600' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz de todos os targets
        # ci/fuzz.sh fixa RUSTUP_TOOLCHAIN=nightly: o rust-toolchain.toml da raiz (stable) tem
        # precedência sobre a toolchain padrão instalada pela action e o cargo-fuzz exige nightly.
        # Inclui decoders e sort_check via descoberta de cargo fuzz list.
        run: ci/fuzz.sh "$SECONDS_PER_TARGET"
      - name: Arquivar logs e corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs
          path: |
            fuzz-logs/
            fuzz/artifacts/
          if-no-files-found: ignore
