# sysusers.d(5) — Etapa 5.11 (ADR0059). Instalar em /usr/lib/sysusers.d/logos.conf.
# Um usuário por processo; o grupo logos-socket só dá acesso ao socket do kernel.
g logos-socket -
u logos-kernel  - "LOGOS kernel (chave e ledger)"      /var/lib/logos-kernel
u logos-gateway - "LOGOS gateway (credenciais)"        /var/lib/logos-gateway
u logos-agent   - "LOGOS agente (sem chave/credencial)" /var/lib/logos-agent
m logos-kernel logos-socket
m logos-agent  logos-socket
