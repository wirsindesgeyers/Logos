# tmpfiles.d(5) — Etapa 5.11 (ADR0059). Instalar em /usr/lib/tmpfiles.d/logos.conf.
# Chave e ledger só do kernel; staging do agente; credenciais só do gateway.
d /etc/logos                       0755 root          root          -
z /etc/logos/kernel.key            0600 logos-kernel  logos-kernel  -
d /var/lib/logos-kernel            0700 logos-kernel  logos-kernel  -
d /var/lib/logos-kernel/ledger     0700 logos-kernel  logos-kernel  -
d /var/lib/logos-kernel/private    0700 logos-kernel  logos-kernel  -
d /var/lib/logos-agent             0700 logos-agent   logos-agent   -
d /var/lib/logos-agent/staging     0700 logos-agent   logos-agent   -
d /var/lib/logos-gateway           0700 logos-gateway logos-gateway -
z /etc/logos/gateway-credentials   0600 logos-gateway logos-gateway -
